plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

sourceSets {
    client {
        java {
            srcDir 'src/client/java'
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
        resources {
            srcDir 'src/client/resources'
        }
    }
}

// The NeoForge moddev plugin auto-provides Minecraft + NeoForge to the main
// compile classpath only. Mirror that into the client classpath so client-only
// classes (e.g. BlockEntityRenderer) can reference Minecraft internals.
configurations.clientCompileClasspath.extendsFrom(configurations.compileClasspath)
configurations.clientRuntimeClasspath.extendsFrom(configurations.runtimeClasspath)
configurations.clientCompileOnly.extendsFrom(configurations.compileOnly)

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
            systemProperty 'forge.logging.markers', 'REGISTRIES'
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArgument '--mod'
            programArgument mod_id
            programArgument '--all'
            programArgument '--output'
            programArgument file('src/generated/resources/').absolutePath
            programArgument '--existing'
            programArgument file('src/main/resources/').absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.client)
        }
    }
}

dependencies {
    // NeoForge and Minecraft are provided automatically by the moddev plugin

    // TFC at compile time only — supplied at runtime via mods.toml dependency on the user's modpack.
    compileOnly files('libs/tfc-1.21.1-4.2.5.jar')

    // Create at compile time only — supplied at runtime via mods.toml dependency.
    // The stamping press is built on top of Create's kinetic block / press engine.
    compileOnly files('libs/create-1.21.1-6.0.10.jar')

    // Create's transitively-required runtime libs, extracted from Create's META-INF/jarjar.
    // Ponder (1.0.82) ships catnip; flywheel + registrate come alongside.
    compileOnly files('libs/ponder-neoforge-1.0.82+mc1.21.1.jar')
    compileOnly files('libs/flywheel-neoforge-1.21.1-1.0.6.jar')
    compileOnly files('libs/Registrate-MC1.21-1.3.0+67.jar')
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// Generate mod metadata from template
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description         : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The NeoForge ModDev plugin's `sourceSet(sourceSets.client)` registers the
// client source set for run-time classpath assembly, but it does NOT add its
// output to the main `jar` task. Merge the client's compiled output into the
// produced mod JAR explicitly so renderer classes packaged there ship with the mod.
tasks.named('jar') {
    from sourceSets.client.output
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}